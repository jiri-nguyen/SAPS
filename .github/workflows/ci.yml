# Quality gates of the PoC — docs/05-testing/test-strategy.md §5, docs/04-development/developer-guide.md §4.3.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (SAPS API, SAPS Worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff-cover compares with origin/main
      - uses: astral-sh/setup-uv@v10.3.3 # no major tags after v7; full tag, updated by Dependabot
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Architecture rules (ADR-0001)
        run: uv run lint-imports
      - name: Tests (unit, integration with Testcontainers)
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: Coverage on changed code >= 90 %
        run: uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=90
      - name: Dependency audit
        run: uv run pip-audit --skip-editable

  frontend:
    name: frontend (SAPS Web App)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match the contract
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - name: Type check
        run: npm run typecheck
      - name: Lint and format
        run: npm run lint
      - name: Tests (coverage >= 90 %)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Dependency audit (runtime dependencies, blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (dev dependencies, report only)
        run: npm audit --audit-level=high
        continue-on-error: true

  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npx --yes @redocly/cli@1.34.5 lint docs/02-architecture/api/saps-api.openapi.yaml

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-smoke:
    name: local stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Local settings with a random CI-only seed password and session key
        run: |
          password="$(openssl rand -hex 16)"
          key="$(openssl rand -base64 32 | tr '+/' '-_')"
          echo "::add-mask::$password"
          echo "::add-mask::$key"
          # A short stuck age and tick keep the lost-message check short (SAPS-37 Q2); the defaults stay 60 s and 10 s.
          sed "s/^SEED_USER_PASSWORD=.*/SEED_USER_PASSWORD=$password/; s/^SESSION_ENCRYPTION_KEY=.*/SESSION_ENCRYPTION_KEY=$key/; s/^SWEEPER_INTERVAL_SECONDS=.*/SWEEPER_INTERVAL_SECONDS=5/; s/^MAIL_POLL_SECONDS=.*/MAIL_POLL_SECONDS=5/; s/^HOLD_RELEASE_SECONDS=.*/HOLD_RELEASE_SECONDS=5/; s/^SWEEPER_STUCK_AFTER_SECONDS=.*/SWEEPER_STUCK_AFTER_SECONDS=15/" .env.example > .env
      - name: Start all containers
        run: docker compose up -d --build --wait
      - name: SAPS Web App, proxy and SAPS API
        run: |
          curl -fsS http://localhost:5173/ > /dev/null
          curl -fsS http://localhost:5173/health
          curl -fsS http://localhost:8000/ready
      - name: Sign-in through Keycloak, Origin check, sign-out and back-channel logout (SAPS-44)
        run: |
          web=http://localhost:5173
          kc=http://localhost:8080
          base=$web/v1/session
          origin="Origin: $web"
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          field() { python3 -c 'import json, sys; d = json.load(sys.stdin); print(eval(sys.argv[1]))' "$1"; }
          sign_in() { .github/scripts/sign-in.sh "$web" "$1" "$password" "$2" "${3:-/}"; }
          test "$(code -X POST -H "$origin" -H 'Content-Type: application/json' -d '{}' "$base")" = 405   # no password sign-in any more
          test "$(sign_in member1@vn.example.com signin-jar '/#/exceptions')" = "$web/#/exceptions"
          curl -fsS -b signin-jar "$base" | grep -q '"displayName":"Accounting Member 1"'
          test "$(code -b signin-jar -X DELETE "$base")" = 403   # Origin check
          logout="$(curl -fsS -b signin-jar -c signin-jar -X DELETE -H "$origin" "$base" | field 'd["logoutUrl"]')"
          case "$logout" in "$kc/realms/saps/protocol/openid-connect/logout?"*) ;; *) echo "logoutUrl $logout"; exit 1;; esac
          test "$(code -b signin-jar "$base")" = 401
          # back-channel logout: an administrator ends the user's Keycloak sessions, the SAPS session ends at once (BR-07)
          sign_in member2@vn.example.com backchannel-jar > /dev/null
          test "$(code -b backchannel-jar "$base")" = 200
          admin_user="$(grep '^KEYCLOAK_ADMIN_USERNAME=' .env | cut -d= -f2)"
          admin_password="$(grep '^KEYCLOAK_ADMIN_PASSWORD=' .env | cut -d= -f2)"
          token="$(curl -fsS -d client_id=admin-cli -d grant_type=password --data-urlencode "username=$admin_user" \
            --data-urlencode "password=$admin_password" $kc/realms/master/protocol/openid-connect/token | field 'd["access_token"]')"
          admin() { curl -fsS -H "Authorization: Bearer $token" "$@"; }
          uid="$(admin "$kc/admin/realms/saps/users?username=member2@vn.example.com&exact=true" | field 'd[0]["id"]')"
          admin -X POST "$kc/admin/realms/saps/users/$uid/logout"
          test "$(code -b backchannel-jar "$base")" = 401
          # a user without a company group is refused (BR-02); created here, removed again
          admin -H 'Content-Type: application/json' -d "{\"username\":\"nogroup@vn.example.com\",\"email\":\"nogroup@vn.example.com\",\"emailVerified\":true,\"enabled\":true,\"firstName\":\"No\",\"lastName\":\"Group\",\"credentials\":[{\"type\":\"password\",\"value\":\"$password\",\"temporary\":false}]}" "$kc/admin/realms/saps/users"
          refused="$(sign_in nogroup@vn.example.com refused-jar || true)"
          nogroup="$(admin "$kc/admin/realms/saps/users?username=nogroup@vn.example.com&exact=true" | field 'd[0]["id"]')"
          admin -X DELETE "$kc/admin/realms/saps/users/$nogroup"
          test "$refused" = "$web/?signIn=no_company"
      - name: Whole invoice flow from upload to Posted (SAPS-17 … SAPS-23, SAPS-49)
        run: |
          base=http://localhost:5173/v1
          origin="Origin: http://localhost:5173"
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          sign_in() { .github/scripts/sign-in.sh http://localhost:5173 "$1" "$password" "$2" > /dev/null; }
          sign_in member1@vn.example.com upload-jar
          upload() {  # $1 file, $2 Idempotency-Key → invoice id
            curl -fsS -b upload-jar -H "$origin" -H "Idempotency-Key: $2" \
              -F "file=@$1;type=application/pdf" "$base/invoices" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])'
          }
          wait_for() {  # $1 invoice id, $2 expected status, $3 expected exception codes (comma separated)
            for i in $(seq 1 30); do
              state="$(curl -fsS -b upload-jar "$base/invoices/$1" | python3 -c 'import json, sys
          i = json.load(sys.stdin)
          codes = sorted({e["code"] for e in i["exceptions"] if e["status"] == "OPEN"}, key=lambda c: int(c[2:]))
          print(i["status"], ",".join(codes))')"
              [ "$state" = "$2 $3" ] && return 0
              sleep 1
            done
            echo "invoice $1 is '$state', expected '$2 $3'"
            docker compose logs worker
            return 1
          }
          printf '%%PDF-1.7\n%% SAPS CI smoke test, not in the sample set\n%%%%EOF\n' > smoke.pdf
          unknown="$(upload smoke.pdf "ci-unknown-$GITHUB_RUN_ID")"
          test "$(upload smoke.pdf "ci-unknown-$GITHUB_RUN_ID")" = "$unknown"   # same key → same invoice
          wait_for "$unknown" EXCEPTION EX1
          ds01="$(upload backend/fixtures/ds-01/invoices/ds-01-trade-po.pdf "ci-ds01-$GITHUB_RUN_ID")"
          wait_for "$ds01" POSTED ""   # no exception, below the threshold: posted to the ERP (SAPS-49)
          ds15="$(upload backend/fixtures/ds-15/invoices/ds-15-duplicate-scan.png "ci-ds15-$GITHUB_RUN_ID")"
          wait_for "$ds15" EXCEPTION EX4,EX9   # duplicate of DS-01 (SAPS-23); DS-01 invoiced the whole PO: not open (SAPS-51)
          ds12="$(upload backend/fixtures/ds-12/invoices/ds-12-price-outside-tolerance.pdf "ci-ds12-$GITHUB_RUN_ID")"
          wait_for "$ds12" EXCEPTION EX6
          test "$(curl -s -o /dev/null -w '%{http_code}' -b upload-jar -H "$origin" -X POST "$base/invoices/$ds12/claim")" = 200
          etag="$(curl -fsS -b upload-jar -D - -o /dev/null "$base/invoices/$ds12" | tr -d '\r' | awk -F': ' 'tolower($1)=="etag" {print $2}')"
          fix='{"lines":[{"lineNumber":1,"description":"USB keyboard","poNumber":"0100012","poLineNumber":1,"quantity":"4","unitPrice":"20.00","lineAmount":"80.00"}]}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b upload-jar -H "$origin" -H "If-Match: $etag" -H 'Content-Type: application/json' -X PATCH -d "$fix" "$base/invoices/$ds12")" = 202
          wait_for "$ds12" POSTED ""   # SAPS-20: claim, correct the price, the worker re-matches and posts
          ds03="$(upload backend/fixtures/ds-03/invoices/ds-03-above-threshold.pdf "ci-ds03-$GITHUB_RUN_ID")"
          wait_for "$ds03" PENDING_APPROVAL ""   # above the approval threshold (SAPS-19)
          sign_in manager1@vn.example.com manager-jar
          test "$(curl -s -o /dev/null -w '%{http_code}' -b upload-jar -H "$origin" -H 'Content-Type: application/json' -d '{"decision":"APPROVED"}' "$base/invoices/$ds03/approval")" = 403   # a member cannot decide
          test "$(curl -s -o /dev/null -w '%{http_code}' -b manager-jar -H "$origin" -H 'Content-Type: application/json' -d '{"decision":"REJECTED"}' "$base/invoices/$ds03/approval")" = 422
          curl -fsS -b manager-jar -H "$origin" -H 'Content-Type: application/json' -d '{"decision":"APPROVED"}' "$base/invoices/$ds03/approval" | grep -q '"status":"POSTING"'   # SAPS-22, SAPS-49: an approval ends in posting
          wait_for "$ds03" POSTED ""
          test "$(curl -s -o /dev/null -w '%{http_code}' -b upload-jar -H "$origin" -X POST "$base/invoices/$ds01/confirmation")" = 404   # the final review is gone (DEC-063)
          curl -fsS -b upload-jar "$base/invoices/$ds01" | python3 -c 'import json, sys
          d = json.load(sys.stdin)
          assert d["status"] == "POSTED" and d["erpDocumentNumber"].startswith("MOCK-") and d["postedAt"], d'
      - name: Matching settings change the next matching run (SAPS-28, DS-18)
        run: |
          base=http://localhost:5173/v1
          origin="Origin: http://localhost:5173"
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          sign_in() { .github/scripts/sign-in.sh http://localhost:5173 "$1" "$password" "$2" > /dev/null; }
          sign_in member1@vn.example.com settings-member-jar
          sign_in manager1@vn.example.com settings-manager-jar
          put() { curl -s -o /dev/null -w '%{http_code}' -b settings-manager-jar -H "$origin" -H 'Content-Type: application/json' -X PUT \
            -d "{\"priceToleranceUsd\":\"$1\",\"approvalThresholdUsd\":\"$2\"}" "$base/matching-settings"; }
          test "$(code -b settings-member-jar "$base/matching-settings")" = 403   # members have no access
          test "$(code -b settings-member-jar -H "$origin" -H 'Content-Type: application/json' -X PUT -d '{"priceToleranceUsd":"1.00","approvalThresholdUsd":"300"}' "$base/matching-settings")" = 403
          curl -fsS -b settings-manager-jar "$base/matching-settings" | grep -q '"updatedBy":"system"'
          test "$(put -1 300)" = 422
          test "$(put 0.12345 300)" = 400
          test "$(put 1.00 300)" = 200
          curl -fsS -b settings-manager-jar "$base/matching-settings" | grep -q '"updatedBy":"Accounting Manager 1"'
          ds18="$(curl -fsS -b settings-member-jar -H "$origin" -H "Idempotency-Key: ci-ds18-$GITHUB_RUN_ID" \
            -F "file=@backend/fixtures/ds-18/invoices/ds-18-settings-tolerance.pdf;type=application/pdf" "$base/invoices" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
          for i in $(seq 1 30); do   # 50.80 against 50.00 matches with the tolerance 1.00
            state="$(curl -fsS -b settings-member-jar "$base/invoices/$ds18" | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')"
            [ "$state" = POSTED ] && break
            sleep 1
          done
          test "$state" = POSTED || { echo "DS-18 is '$state', expected POSTED"; docker compose logs worker; exit 1; }
          test "$(put 0.5 300)" = 200   # back to the defaults
      - name: Notifications for members and managers (SAPS-24)
        run: |
          base=http://localhost:5173/v1
          origin="Origin: http://localhost:5173"
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          sign_in() { .github/scripts/sign-in.sh http://localhost:5173 "$1" "$password" "$2" > /dev/null; }
          sign_in member1@vn.example.com notify-member1-jar
          sign_in manager1@vn.example.com notify-manager1-jar
          field() { python3 -c 'import json, sys; d = json.load(sys.stdin); print(eval(sys.argv[1]))' "$1"; }
          list() { curl -fsS -b "notify-$1-jar" "$base/notifications$2"; }
          types() { list "$1" "" | field 'sorted({i["type"] for i in d["items"]})'; }
          test "$(types member1)" = "['EXCEPTION_RAISED', 'REVIEW_REQUESTED']"   # the exceptions and the reviews of the flow above
          test "$(types manager1)" = "['APPROVAL_REQUESTED']"   # DS-03 waited for approval
          unread="$(list member1 '?unreadOnly=true' | field 'd["unreadCount"]')"
          test "$unread" -gt 1
          mine="$(list member1 '' | field 'd["items"][0]["id"]')"
          managers="$(list manager1 '' | field 'd["items"][0]["id"]')"
          test "$(code -b notify-member1-jar -H "$origin" -X POST "$base/notifications/$mine/read")" = 204
          test "$(code -b notify-member1-jar -H "$origin" -X POST "$base/notifications/$mine/read")" = 204   # idempotent
          test "$(list member1 '' | field 'd["unreadCount"]')" = "$((unread - 1))"
          test "$(code -b notify-member1-jar -H "$origin" -X POST "$base/notifications/$managers/read")" = 404   # another user's
          test "$(code -b notify-member1-jar -H "$origin" -X POST "$base/notifications/00000000-0000-4000-8000-000000000000/read")" = 404
          test "$(code -b notify-member1-jar "$base/notifications?pageToken=nope")" = 400
          test "$(code -b notify-member1-jar -H "$origin" -X POST "$base/notifications/read-all")" = 204
          test "$(list member1 '' | field 'd["unreadCount"]')" = 0
          test "$(list manager1 '' | field 'd["unreadCount"]')" -gt 0   # read state is per user
          test "$(code "$base/notifications")" = 401
      - name: Two demo companies keep their invoices apart (SAPS-42)
        run: |
          base=http://localhost:5173/v1
          origin="Origin: http://localhost:5173"
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          sign_in() { .github/scripts/sign-in.sh http://localhost:5173 "$1" "$password" "$2" > /dev/null; }
          sign_in member1@sg.example.com sg-jar
          curl -fsS -b sg-jar "$base/session" | grep -q '"companyName":"Demo Singapore"'
          test "$(curl -fsS -b sg-jar "$base/invoices?pageSize=100" | python3 -c 'import json, sys; print(len(json.load(sys.stdin)["items"]))')" = 0   # nothing of Demo Vietnam
          id="$(curl -fsS -b sg-jar -H "$origin" -H "Idempotency-Key: ci-sg-$GITHUB_RUN_ID" \
            -F "file=@backend/fixtures/ds-01/invoices/ds-01-trade-po.pdf;type=application/pdf" "$base/invoices" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
          for i in $(seq 1 30); do   # DS-01 is Completed in Demo Vietnam: no EX9 and no quantity used up here
            state="$(curl -fsS -b sg-jar "$base/invoices/$id" | python3 -c 'import json, sys; i = json.load(sys.stdin); print(i["status"], ",".join(e["code"] for e in i["exceptions"]))')"
            [ "$state" = "POSTED " ] && break
            sleep 1
          done
          test "$state" = "POSTED " || { echo "invoice is '$state'"; docker compose logs worker; exit 1; }
      - name: Invoice by mail reaches the company of its mailbox (SAPS-45)
        run: |
          web=http://localhost:5173
          base=$web/v1
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          field() { python3 -c 'import json, sys; d = json.load(sys.stdin); print(eval(sys.argv[1]))' "$1"; }
          # Demo Malaysia has not seen DS-01: it reaches Pending review there (per-company ERP data, SAPS-42)
          python3 backend/tools/send_test_mail.py --smtp localhost:3025 --to ap@my.example.com \
            --subject "CI invoice $GITHUB_RUN_ID" backend/fixtures/ds-01/invoices/ds-01-trade-po.pdf
          python3 backend/tools/send_test_mail.py --smtp localhost:3025 --to ap@my.example.com \
            --subject "CI mail without attachment $GITHUB_RUN_ID"
          .github/scripts/sign-in.sh $web member1@my.example.com "$password" my-mail-jar > /dev/null
          for i in $(seq 1 60); do   # the worker reads the mailboxes every 5 s in CI
            id="$(curl -fsS -b my-mail-jar "$base/invoices?pageSize=100" | field '(d["items"][0]["id"] if d["items"] else "")')"
            [ -n "$id" ] && state="$(curl -fsS -b my-mail-jar "$base/invoices/$id" | field 'd["status"]')" && [ "$state" = POSTED ] && break
            sleep 1
          done
          test "$state" = POSTED || { echo "mail invoice is '$state'"; docker compose logs worker; exit 1; }
          curl -fsS -b my-mail-jar "$base/invoices/$id" | python3 -c 'import json, sys
          d = json.load(sys.stdin)
          assert d["uploadedBy"] is None, d["uploadedBy"]
          assert d["source"]["channel"] == "MAIL" and d["source"]["mailSubject"].startswith("CI invoice"), d["source"]
          assert d["source"]["mailFrom"] == "Vendor Ltd <billing@vendor.example.net>", d["source"]'
          test "$(curl -fsS -b my-mail-jar "$base/invoices?pageSize=100" | field 'len(d["items"])')" = 1   # one invoice, the other mail had none
          .github/scripts/sign-in.sh $web member1@vn.example.com "$password" vn-mail-jar > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -b vn-mail-jar "$base/invoices/$id")" = 404   # another company never sees it
          python3 - <<'PY'
          import imaplib, time
          def count(folder):
              c = imaplib.IMAP4("localhost", 3143)
              c.login("ap@my.example.com", "x")
              status, data = c.select(folder, readonly=True)
              c.logout()
              return int(data[0]) if status == "OK" else 0
          for _ in range(30):
              if (count("INBOX"), count("Processed"), count("Skipped")) == (0, 1, 1):
                  break
              time.sleep(1)
          assert (count("INBOX"), count("Processed"), count("Skipped")) == (0, 1, 1), "the mails were not moved"
          PY
          docker compose logs worker | grep -q '"message": "mail_skipped"'
          docker compose logs worker | grep -q '"message": "mail_imported"'
      - name: Search all invoices (SAPS-46)
        run: |
          web=http://localhost:5173
          base=$web/v1
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          field() { python3 -c 'import json, sys; d = json.load(sys.stdin); print(eval(sys.argv[1]))' "$1"; }
          sign_in() { .github/scripts/sign-in.sh $web "$1" "$password" "$2" > /dev/null; }
          search() { curl -fsS -b "$1" -G "$base/invoices" "${@:2}"; }
          code() { curl -s -o /dev/null -w '%{http_code}' -b "$1" -G "$base/invoices" "${@:2}"; }
          sign_in member1@vn.example.com search-vn-jar
          sign_in member1@my.example.com search-my-jar
          sign_in member1@sg.example.com search-sg-jar
          # DS-01 is Posted in Demo Vietnam; the number typed with spaces matches (DEC-042), a Posted invoice is listed
          vn="$(search search-vn-jar --data-urlencode 'invoiceNumber=aos 2026 1001' --data-urlencode status=POSTED | field '[i["id"] for i in d["items"]]')"
          test "$(echo "$vn" | python3 -c 'import ast, sys; print(len(ast.literal_eval(sys.stdin.read())))')" = 1
          test "$(search search-vn-jar --data-urlencode 'vendor=ALPHA office' --data-urlencode poNumber=0100001 | field 'len(d["items"])')" -ge 1
          test "$(search search-vn-jar --data-urlencode channel=MAIL | field 'len(d["items"])')" = 0   # Demo Vietnam got no mail invoice
          # the invoice that came by mail is in Demo Malaysia only
          test "$(search search-my-jar --data-urlencode channel=MAIL | field '[(i["channel"], i["status"]) for i in d["items"]]')" = "[('MAIL', 'POSTED')]"
          # Demo Singapore has its own DS-01: same number, another invoice
          sg="$(search search-sg-jar --data-urlencode 'invoiceNumber=aos 2026 1001' --data-urlencode status=POSTED | field '[i["id"] for i in d["items"]]')"
          test "$(echo "$sg" | python3 -c 'import ast, sys; print(len(ast.literal_eval(sys.stdin.read())))')" = 1
          test "$sg" != "$vn"
          # upload days in the company time zone, and the refused filters
          yesterday="$(python3 -c 'import datetime; print(datetime.date.today() - datetime.timedelta(days=1))')"
          tomorrow="$(python3 -c 'import datetime; print(datetime.date.today() + datetime.timedelta(days=1))')"
          all="$(search search-vn-jar --data-urlencode pageSize=100 | field 'len(d["items"])')"
          test "$(search search-vn-jar --data-urlencode uploadedFrom=$yesterday --data-urlencode uploadedTo=$tomorrow --data-urlencode pageSize=100 | field 'len(d["items"])')" = "$all"
          test "$(search search-vn-jar --data-urlencode uploadedTo=2020-01-01 | field 'len(d["items"])')" = 0
          test "$(code search-vn-jar --data-urlencode poNumber=12)" = 400
          test "$(code search-vn-jar --data-urlencode totalMin=10 --data-urlencode totalMax=5)" = 400
          test "$(code search-vn-jar --data-urlencode channel=FAX)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/invoices")" = 401
      - name: Processing calendar holds and releases invoices (SAPS-52)
        run: |
          web=http://localhost:5173
          base=$web/v1
          origin="Origin: $web"
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          field() { python3 -c 'import json, sys; d = json.load(sys.stdin); print(eval(sys.argv[1]))' "$1"; }
          sign_in() { .github/scripts/sign-in.sh $web "$1" "$password" "$2" > /dev/null; }
          status_of() { curl -fsS -b calendar-member-jar "$base/invoices/$1" | field 'd["status"]'; }
          wait_for() {  # $1 invoice id, $2 expected status
            for i in $(seq 1 40); do [ "$(status_of "$1")" = "$2" ] && return 0; sleep 1; done
            echo "invoice $1 is '$(status_of "$1")', expected '$2'"; docker compose logs worker; return 1
          }
          sign_in manager1@sg.example.com calendar-manager-jar
          sign_in member1@sg.example.com calendar-member-jar
          # Demo Singapore closes today (a day of its own time zone): new invoices are held
          today="$(python3 -c 'import datetime, zoneinfo; print(datetime.datetime.now(zoneinfo.ZoneInfo("Asia/Singapore")).date())')"
          put() { curl -fsS -b calendar-manager-jar -H "$origin" -H 'Content-Type: application/json' -X PUT -d "$1" "$base/processing-calendar"; }
          put "{\"rules\":[{\"kind\":\"DATE\",\"date\":\"$today\",\"label\":\"CI\"}]}" | grep -q '"closedToday":true'
          curl -fsS -b calendar-member-jar "$base/processing-calendar" | grep -q '"closedToday":true'   # members see the banner too
          test "$(curl -s -o /dev/null -w '%{http_code}' -b calendar-member-jar -H "$origin" -H 'Content-Type: application/json' -X PUT -d '{"rules":[]}' "$base/processing-calendar")" = 403
          upload() { curl -fsS -b calendar-member-jar -H "$origin" -H "Idempotency-Key: $2-$GITHUB_RUN_ID" -F "file=@$1;type=application/pdf" "$base/invoices" | field 'd["id"]'; }
          first="$(upload backend/fixtures/ds-12/invoices/ds-12-price-outside-tolerance.pdf ci-hold-1)"
          second="$(upload backend/fixtures/ds-03/invoices/ds-03-above-threshold.pdf ci-hold-2)"
          wait_for "$first" ON_HOLD
          wait_for "$second" ON_HOLD
          # "Process now": only a manager; the invoice is processed although the company is closed, the other stays held
          test "$(curl -s -o /dev/null -w '%{http_code}' -b calendar-member-jar -H "$origin" -X POST "$base/invoices/$first/release")" = 403
          curl -fsS -b calendar-manager-jar -H "$origin" -X POST "$base/invoices/$first/release" | grep -q '"status":"UPLOADED"'
          wait_for "$first" EXCEPTION   # DS-12: price outside the tolerance (EX6)
          test "$(curl -s -o /dev/null -w '%{http_code}' -b calendar-manager-jar -H "$origin" -X POST "$base/invoices/$first/release")" = 409
          sleep 12   # more than two release ticks: a closed company keeps its held invoices
          test "$(status_of "$second")" = ON_HOLD
          # the calendar changes: the held invoice is released and processed within the release interval
          put '{"rules":[]}' | grep -q '"closedToday":false'
          wait_for "$second" PENDING_APPROVAL   # DS-03: above the approval threshold
          docker compose logs worker | grep -q '"message": "invoice_held"'
          docker compose logs worker | grep -q '"message": "invoices_released"'
          # posting waits on a closed day too (SAPS-49 BR-11, DEC-070): approval is worked on, posting is held
          put "{\"rules\":[{\"kind\":\"DATE\",\"date\":\"$today\",\"label\":\"CI\"}]}" | grep -q '"closedToday":true'
          curl -fsS -b calendar-manager-jar -H "$origin" -H 'Content-Type: application/json' -d '{"decision":"APPROVED"}' "$base/invoices/$second/approval" | grep -q '"status":"POSTING"'
          for i in $(seq 1 20); do docker compose logs worker | grep -q '"message": "posting_held"' && break; sleep 1; done
          docker compose logs worker | grep -q '"message": "posting_held"'
          sleep 12   # more than two release ticks: a closed company keeps its held postings
          test "$(status_of "$second")" = POSTING
          put '{"rules":[]}' | grep -q '"closedToday":false'
          wait_for "$second" POSTED
          docker compose logs worker | grep -q '"message": "postings_released"'
      - name: Trade PO invoices are matched per received lot (SAPS-51, DS-21 to DS-25)
        run: |
          web=http://localhost:5173
          base=$web/v1
          origin="Origin: http://localhost:5173"
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          field() { python3 -c 'import json, sys; d = json.load(sys.stdin); print(eval(sys.argv[1]))' "$1"; }
          .github/scripts/sign-in.sh $web member1@vn.example.com "$password" lot-jar > /dev/null
          upload() { curl -fsS -b lot-jar -H "$origin" -H "Idempotency-Key: $2-$GITHUB_RUN_ID" -F "file=@$1;type=application/pdf" "$base/invoices" | field 'd["id"]'; }
          state_of() { curl -fsS -b lot-jar "$base/invoices/$1" | field 'd["status"] + " " + ",".join(sorted({e["code"] for e in d["exceptions"] if e["status"] == "OPEN"}, key=lambda c: int(c[2:])))'; }
          wait_for() {  # $1 invoice id, $2 expected status, $3 expected open exception codes
            for i in $(seq 1 40); do [ "$(state_of "$1")" = "$2 $3" ] && return 0; sleep 1; done
            echo "invoice $1 is '$(state_of "$1")', expected '$2 $3'"; docker compose logs worker; return 1
          }
          fixtures=backend/fixtures
          ds21="$(upload $fixtures/ds-21/invoices/ds-21-lot-by-do-number.pdf ci-ds21)"
          wait_for "$ds21" POSTED ""   # the second lot of a two-lot PO, found by its DO number
          curl -fsS -b lot-jar "$base/invoices/$ds21" | python3 -c 'import json, sys
          line = json.load(sys.stdin)["lines"][0]
          assert line["doNumber"] == line["matchedDoNumber"] == "DO-7000021B", line
          assert line["pirUnitPrice"] == "40.0000" and line["expectedQuantity"] == "4.000", line'
          ds22="$(upload $fixtures/ds-22/invoices/ds-22-do-number-missing.pdf ci-ds22)"
          wait_for "$ds22" EXCEPTION EX11
          test "$(curl -s -o /dev/null -w '%{http_code}' -b lot-jar -H "$origin" -X POST "$base/invoices/$ds22/claim")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -b lot-jar -H "$origin" -H 'Content-Type: application/json' -X POST "$base/invoices/$ds22/resolution")" != 200   # EX11 cannot be accepted as is (DEC-068)
          ds23="$(upload $fixtures/ds-23/invoices/ds-23-invalid-do-number.pdf ci-ds23)"
          wait_for "$ds23" EXCEPTION EX13
          test "$(curl -s -o /dev/null -w '%{http_code}' -b lot-jar -H "$origin" -X POST "$base/invoices/$ds23/claim")" = 200
          etag="$(curl -fsS -b lot-jar -D - -o /dev/null "$base/invoices/$ds23" | tr -d '\r' | awk -F': ' 'tolower($1)=="etag" {print $2}')"
          fix='{"lines":[{"lineNumber":1,"description":"Label printer","poNumber":"0100023","poLineNumber":1,"doNumber":"DO-7000023A","quantity":"6","unitPrice":"40.00","lineAmount":"240.00"}]}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b lot-jar -H "$origin" -H "If-Match: $etag" -H 'Content-Type: application/json' -X PATCH -d "$fix" "$base/invoices/$ds23")" = 202
          wait_for "$ds23" POSTED ""   # the DO number is a matching field: the worker re-matches (DEC-069)
          ds24="$(upload $fixtures/ds-24/invoices/ds-24-no-purchasing-info-record.pdf ci-ds24)"
          wait_for "$ds24" EXCEPTION EX12
          ds25="$(upload $fixtures/ds-25/invoices/ds-25-po-not-open.pdf ci-ds25)"
          wait_for "$ds25" EXCEPTION EX4
      - name: Accepting exceptions runs the workflow again, approval ends in posting (SAPS-49, DS-08)
        run: |
          web=http://localhost:5173
          base=$web/v1
          origin="Origin: http://localhost:5173"
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          field() { python3 -c 'import json, sys; d = json.load(sys.stdin); print(eval(sys.argv[1]))' "$1"; }
          .github/scripts/sign-in.sh $web member1@vn.example.com "$password" accept-jar > /dev/null
          .github/scripts/sign-in.sh $web manager1@vn.example.com "$password" accept-manager-jar > /dev/null
          state_of() { curl -fsS -b accept-jar "$base/invoices/$1" | field 'd["status"] + " " + ",".join(sorted({e["code"] for e in d["exceptions"] if e["status"] == "OPEN"}, key=lambda c: int(c[2:])))'; }
          wait_for() {  # $1 invoice id, $2 expected status, $3 expected open exception codes
            for i in $(seq 1 40); do [ "$(state_of "$1")" = "$2 $3" ] && return 0; sleep 1; done
            echo "invoice $1 is '$(state_of "$1")', expected '$2 $3'"; docker compose logs worker; return 1
          }
          ds08="$(curl -fsS -b accept-jar -H "$origin" -H "Idempotency-Key: ci-ds08-$GITHUB_RUN_ID" -F "file=@backend/fixtures/ds-08/invoices/ds-08-non-po.pdf;type=application/pdf" "$base/invoices" | field 'd["id"]')"
          wait_for "$ds08" EXCEPTION EX2   # a non-PO invoice goes to the manual review
          test "$(curl -s -o /dev/null -w '%{http_code}' -b accept-jar -H "$origin" -X POST "$base/invoices/$ds08/claim")" = 200
          etag="$(curl -fsS -b accept-jar -D - -o /dev/null "$base/invoices/$ds08" | tr -d '\r' | awk -F': ' 'tolower($1)=="etag" {print $2}')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b accept-jar -H "$origin" -H "If-Match: $etag" -X POST "$base/invoices/$ds08/resolution")" = 202   # the workflow runs again
          wait_for "$ds08" PENDING_APPROVAL ""   # EX2 stays accepted (BR-05); 450 USD is above the threshold
          test "$(curl -s -o /dev/null -w '%{http_code}' -b accept-jar -H "$origin" -H 'Content-Type: application/json' -d '{"decision":"APPROVED"}' "$base/invoices/$ds08/approval")" = 403
          curl -fsS -b accept-manager-jar -H "$origin" -H 'Content-Type: application/json' -d '{"decision":"APPROVED"}' "$base/invoices/$ds08/approval" | grep -q '"status":"POSTING"'
          wait_for "$ds08" POSTED ""
          curl -fsS -b accept-jar "$base/invoices/$ds08" | python3 -c 'import json, sys
          d = json.load(sys.stdin)
          assert d["erpDocumentNumber"].startswith("MOCK-") and d["postedAt"], d'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b accept-jar -H "$origin" -H 'Content-Type: application/json' -d '{"reason":"late"}' "$base/invoices/$ds08/rejection")" = 409   # a Posted invoice cannot be rejected
      - name: Keycloak realm with the demo companies (SAPS-43)
        run: |
          kc=http://localhost:8080
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          admin_user="$(grep '^KEYCLOAK_ADMIN_USERNAME=' .env | cut -d= -f2)"
          admin_password="$(grep '^KEYCLOAK_ADMIN_PASSWORD=' .env | cut -d= -f2)"
          field() { python3 -c 'import json, sys; d = json.load(sys.stdin); print(eval(sys.argv[1]))' "$1"; }
          test "$(curl -fsS $kc/realms/saps/.well-known/openid-configuration | field 'd["issuer"]')" = "$kc/realms/saps"
          token="$(curl -fsS -d client_id=admin-cli -d grant_type=password --data-urlencode "username=$admin_user" \
            --data-urlencode "password=$admin_password" $kc/realms/master/protocol/openid-connect/token | field 'd["access_token"]')"
          api() { curl -fsS -H "Authorization: Bearer $token" "$kc/admin/realms/saps$1"; }
          test "$(api '/users?max=100' | field 'len(d)')" = 9
          test "$(api '' | field '(d["bruteForceProtected"], d["registrationAllowed"])')" = "(True, False)"
          test "$(api '/clients?clientId=saps-web' | field '(d[0]["publicClient"], d[0]["directAccessGrantsEnabled"], d[0]["standardFlowEnabled"])')" = "(False, False, True)"
          test "$(api '/groups?search=sg' | field '[g["path"] for s in d for g in s.get("subGroups", [])]')" = "['/companies/sg']"
          uid="$(api '/users?username=member1@sg.example.com&exact=true' | field 'd[0]["id"]')"
          test "$(api "/users/$uid/groups" | field '[g["path"] for g in d]')" = "['/companies/sg']"
          test "$(api "/users/$uid/role-mappings/realm" | field '[r["name"] for r in d]')" = "['ACCOUNTING_MEMBER']"
          # the imported demo password works (direct grant of the built-in admin-cli client, only to prove the import)
          curl -fsS -d client_id=admin-cli -d grant_type=password --data-urlencode "username=member1@sg.example.com" \
            --data-urlencode "password=$password" $kc/realms/saps/protocol/openid-connect/token | grep -q access_token
      - name: SAPS API → SAPS Message Broker → SAPS Worker
        run: |
          docker compose exec -T api python -c "from saps.worker.actors import ping; ping.send('ci-smoke')"
          for i in $(seq 1 20); do
            docker compose logs worker | grep -q '"correlation_id": "ci-smoke"' && exit 0
            sleep 1
          done
          docker compose logs worker
          exit 1
      - name: Lost message is recovered by the sweeper (SAPS-37)
        run: |
          base=http://localhost:5173/v1
          origin="Origin: http://localhost:5173"
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          sign_in() { .github/scripts/sign-in.sh http://localhost:5173 "$1" "$password" "$2" > /dev/null; }
          sign_in member1@vn.example.com sweeper-jar
          docker compose stop worker   # nobody takes the message
          id="$(curl -fsS -b sweeper-jar -H "$origin" -H "Idempotency-Key: ci-lost-$GITHUB_RUN_ID" \
            -F "file=@backend/fixtures/ds-17/invoices/ds-17-rejected-at-review.pdf;type=application/pdf" "$base/invoices" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
          docker compose exec -T redis redis-cli FLUSHALL   # the message is lost
          docker compose start worker
          for i in $(seq 1 60); do   # stuck after 15 s, swept at the next 5 s tick
            state="$(curl -fsS -b sweeper-jar "$base/invoices/$id" | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')"
            [ "$state" = POSTED ] && break
            sleep 1
          done
          test "$state" = POSTED || { echo "invoice is '$state', expected POSTED"; docker compose logs worker; exit 1; }
          curl -fsS -b sweeper-jar "$base/invoices/$id/events" | python3 -c 'import json, sys
          events = json.load(sys.stdin)["items"]
          actions = [(e["action"], e["actor"]) for e in events]
          assert ("RESEND", "system") in actions, actions'
          docker compose logs worker | grep -q '"message": "sweeper_resent"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
