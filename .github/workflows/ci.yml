# Quality gates of the PoC — docs/05-testing/test-strategy.md §5, docs/04-development/developer-guide.md §4.3.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (SAPS API, SAPS Worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # diff-cover compares with origin/main
      - uses: astral-sh/setup-uv@v10.3.3 # no major tags after v7; full tag, updated by Dependabot
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Architecture rules (ADR-0001)
        run: uv run lint-imports
      - name: Tests (unit, integration with Testcontainers)
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: Coverage on changed code >= 90 %
        run: uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=90
      - name: Dependency audit
        run: uv run pip-audit --skip-editable

  frontend:
    name: frontend (SAPS Web App)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match the contract
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - name: Type check
        run: npm run typecheck
      - name: Lint and format
        run: npm run lint
      - name: Tests (coverage >= 90 %)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Dependency audit (runtime dependencies, blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (dev dependencies, report only)
        run: npm audit --audit-level=high
        continue-on-error: true

  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npx --yes @redocly/cli@1.34.5 lint docs/02-architecture/api/saps-api.openapi.yaml

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-smoke:
    name: local stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Local settings with a random CI-only seed password
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          sed "s/^SEED_USER_PASSWORD=.*/SEED_USER_PASSWORD=$password/" .env.example > .env
      - name: Start all containers
        run: docker compose up -d --build --wait
      - name: SAPS Web App, proxy and SAPS API
        run: |
          curl -fsS http://localhost:5173/ > /dev/null
          curl -fsS http://localhost:5173/health
          curl -fsS http://localhost:8000/ready
      - name: Sign-in, Origin check and sign-out through the proxy (SAPS-27)
        run: |
          base=http://localhost:5173/v1/session
          origin="Origin: http://localhost:5173"
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          body="{\"username\":\"member1\",\"password\":\"$password\"}"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code -X POST -H 'Content-Type: application/json' -d "$body" "$base")" = 403
          curl -fsS -c jar -H "$origin" -H 'Content-Type: application/json' -d "$body" "$base" | grep -q ACCOUNTING_MEMBER
          curl -fsS -b jar "$base" | grep -q '"displayName":"Accounting Member 1"'
          test "$(code -b jar -c jar -X DELETE -H "$origin" "$base")" = 204
          test "$(code -b jar "$base")" = 401
      - name: Upload, extraction, duplicate check, matching and exception handling (SAPS-17 … SAPS-23)
        run: |
          base=http://localhost:5173/v1
          origin="Origin: http://localhost:5173"
          password="$(grep '^SEED_USER_PASSWORD=' .env | cut -d= -f2)"
          curl -fsS -c upload-jar -H "$origin" -H 'Content-Type: application/json' \
            -d "{\"username\":\"member1\",\"password\":\"$password\"}" "$base/session" > /dev/null
          upload() {  # $1 file, $2 Idempotency-Key → invoice id
            curl -fsS -b upload-jar -H "$origin" -H "Idempotency-Key: $2" \
              -F "file=@$1;type=application/pdf" "$base/invoices" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])'
          }
          wait_for() {  # $1 invoice id, $2 expected status, $3 expected exception codes (comma separated)
            for i in $(seq 1 30); do
              state="$(curl -fsS -b upload-jar "$base/invoices/$1" | python3 -c 'import json, sys
          i = json.load(sys.stdin)
          codes = sorted({e["code"] for e in i["exceptions"] if e["status"] == "OPEN"}, key=lambda c: int(c[2:]))
          print(i["status"], ",".join(codes))')"
              [ "$state" = "$2 $3" ] && return 0
              sleep 1
            done
            echo "invoice $1 is '$state', expected '$2 $3'"
            docker compose logs worker
            return 1
          }
          printf '%%PDF-1.7\n%% SAPS CI smoke test, not in the sample set\n%%%%EOF\n' > smoke.pdf
          unknown="$(upload smoke.pdf "ci-unknown-$GITHUB_RUN_ID")"
          test "$(upload smoke.pdf "ci-unknown-$GITHUB_RUN_ID")" = "$unknown"   # same key → same invoice
          wait_for "$unknown" EXCEPTION EX1
          ds01="$(upload backend/fixtures/ds-01/invoices/ds-01-trade-po.pdf "ci-ds01-$GITHUB_RUN_ID")"
          wait_for "$ds01" PENDING_REVIEW ""
          ds15="$(upload backend/fixtures/ds-15/invoices/ds-15-duplicate-scan.png "ci-ds15-$GITHUB_RUN_ID")"
          wait_for "$ds15" EXCEPTION EX7,EX9   # duplicate of DS-01 (SAPS-23), quantity already invoiced
          ds12="$(upload backend/fixtures/ds-12/invoices/ds-12-price-outside-tolerance.pdf "ci-ds12-$GITHUB_RUN_ID")"
          wait_for "$ds12" EXCEPTION EX6
          test "$(curl -s -o /dev/null -w '%{http_code}' -b upload-jar -H "$origin" -X POST "$base/invoices/$ds12/claim")" = 200
          etag="$(curl -fsS -b upload-jar -D - -o /dev/null "$base/invoices/$ds12" | tr -d '\r' | awk -F': ' 'tolower($1)=="etag" {print $2}')"
          fix='{"lines":[{"lineNumber":1,"description":"USB keyboard","poNumber":"0100012","poLineNumber":1,"quantity":"4","unitPrice":"20.00","lineAmount":"80.00"}]}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b upload-jar -H "$origin" -H "If-Match: $etag" -H 'Content-Type: application/json' -X PATCH -d "$fix" "$base/invoices/$ds12")" = 202
          wait_for "$ds12" PENDING_REVIEW ""   # SAPS-20: claim, correct the price, the worker re-matches
      - name: SAPS API → SAPS Message Broker → SAPS Worker
        run: |
          docker compose exec -T api python -c "from saps.worker.actors import ping; ping.send('ci-smoke')"
          for i in $(seq 1 20); do
            docker compose logs worker | grep -q '"correlation_id": "ci-smoke"' && exit 0
            sleep 1
          done
          docker compose logs worker
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
