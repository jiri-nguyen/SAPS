# Install once: `uvx pre-commit install` (Developer Guide §5.1).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend lint (eslint, prettier)
        entry: bash -c 'cd frontend && npm run --silent lint'
        language: system
        files: ^frontend/
        pass_filenames: false
