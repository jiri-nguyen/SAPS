# OpenAPI 3.1 contract of the SAPS API (Smart-AP-Suite PoC). Contract-first: change this file before or with the code.
# Names follow the glossary (arc42 §12) and the data model; JSON properties are camelCase versions of the data model attributes.
openapi: 3.1.0
info:
  title: SAPS API
  version: "0.3.0"
  description: |
    HTTP API of Smart-AP-Suite, called by the SAPS Web App. Covers sign-in, invoice upload, the exception queue,
    approval, final review, notifications and matching settings.

    Owner container: SAPS API — see arc42 §5 (`docs/02-architecture/arc42/05-building-block-view.md`).
    Runtime flow: arc42 §6.2. Business rules: decision log DEC-005 … DEC-034.

    **Conventions**
    - Money and quantities are decimal strings (no floating point). Currency is ISO 4217; only `USD` in the PoC (DEC-006).
    - Timestamps are ISO 8601 UTC. Lists use cursor pagination (`pageSize`, `pageToken`, `nextPageToken`).
    - Errors use RFC 9457 `application/problem+json`.
    - Processing is asynchronous (ADR-0004): upload and re-match return `202 Accepted`; clients poll the invoice or
      the notifications to see the result.
    - The tenant is taken from the signed-in user (ADR-0007); it never appears in requests.
    - Authentication uses a server-side session in the HttpOnly cookie `saps_session` (ADR-0008). State-changing requests
      (POST, PUT, PATCH, DELETE) must carry an `Origin` header matching the SAPS Web App origin; otherwise `403` (CSRF protection).
    - `x-roles` lists the roles allowed to call an operation; other signed-in users get `403`.
  contact:
    name: Solution Architect / Tech Lead
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000
    description: local PoC (Docker Compose)
tags:
  - name: Session
    description: Sign-in with simple user accounts (NFR-SEC-001)
  - name: Invoices
    description: Invoice upload, exception handling, approval and final review
  - name: Notifications
    description: In-app notifications (DEC-021)
  - name: MatchingSettings
    description: Price tolerance and approval threshold (DEC-015)
  - name: Health
    description: Liveness of the SAPS API
security:
  - sessionCookie: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the SAPS API is running
      tags: [Health]
      security: []
      responses:
        "200":
          description: The SAPS API is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /v1/session:
    post:
      operationId: createSession
      summary: Sign in
      description: Checks the credentials and sets the session cookie `saps_session` (HttpOnly, SameSite=Lax; ADR-0008). A new session is created at every sign-in.
      tags: [Session]
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionCreate" }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: Session cookie `saps_session`
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: getSession
      summary: Get the signed-in user
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteSession
      summary: Sign out
      tags: [Session]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204": { description: Signed out; the session is revoked and the cookie is cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/invoices:
    post:
      operationId: uploadInvoice
      summary: Upload an invoice file
      description: |
        Stores the file in SAPS File Storage, creates the invoice with status `UPLOADED` and queues processing
        (ADR-0004, ADR-0006). Extraction, duplicate check, type derivation and matching run asynchronously.
        A file that is not in the dummy sample set ends in status `EXCEPTION` with `EX1` (DEC-012).
        Accepted media types in the PoC: PDF, JPEG, PNG. Maximum file size: TBD (MTG-20261114 Q7).
      tags: [Invoices]
      x-roles: [ACCOUNTING_MEMBER]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: Invoice file (PDF, JPEG or PNG)
            encoding:
              file:
                contentType: application/pdf, image/jpeg, image/png
      responses:
        "202":
          description: Invoice created; processing queued
          headers:
            Location:
              description: URL of the created invoice
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listInvoices
      summary: List invoices
      description: |
        Newest first. The exception queue (DEC-016) is `status=EXCEPTION`; approvals waiting for the
        Accounting Manager are `status=PENDING_APPROVAL`.
      tags: [Invoices]
      x-roles: [ACCOUNTING_MEMBER, ACCOUNTING_MANAGER]
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by one or more statuses
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/InvoiceStatus" }
        - name: invoiceType
          in: query
          required: false
          schema: { $ref: "#/components/schemas/InvoiceType" }
        - name: assignee
          in: query
          required: false
          description: "`me` = claimed by the caller; `unassigned` = not claimed by anyone"
          schema: { type: string, enum: [me, unassigned] }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of invoices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceSummaryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/invoices/{invoiceId}:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    get:
      operationId: getInvoice
      summary: Get an invoice with its lines, exceptions and approval
      tags: [Invoices]
      x-roles: [ACCOUNTING_MEMBER, ACCOUNTING_MANAGER]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The invoice
          headers:
            ETag:
              description: Version of the invoice; send it in `If-Match` when updating
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: updateInvoice
      summary: Correct invoice data during exception handling
      description: |
        Allowed only in status `EXCEPTION` and only for the Accounting Member who claimed the invoice.
        Fields not sent stay unchanged; `lines`, when sent, replaces all lines.
        If a matching field changes (vendorCode, invoiceNumber, poNumber, poLineNumber, quantity, unitPrice — DEC-024),
        the status becomes `MATCHING`, re-matching is queued (DEC-010) and the response is `202`; otherwise `200`.
        While the status is `MATCHING`, update, resolve and reject return `409` (SAPS-20).
      tags: [Invoices]
      x-roles: [ACCOUNTING_MEMBER]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceUpdate" }
      responses:
        "200":
          description: Saved; no matching field changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "202":
          description: Saved; a matching field changed and re-matching is queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/invoices/{invoiceId}/claim:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    post:
      operationId: claimInvoice
      summary: Pick an invoice from the exception queue
      description: Assigns an invoice in status `EXCEPTION` to the caller (DEC-016). `409` if another member claimed it.
      tags: [Invoices]
      x-roles: [ACCOUNTING_MEMBER]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Claimed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: releaseInvoiceClaim
      summary: Return a claimed invoice to the exception queue
      description: |
        Clears the claim of an invoice in status `EXCEPTION` (SAPS-20 BR-03). Allowed for the claimant; an Accounting
        Manager can release any claim (pending SAPS-20 Q2). `409` if the invoice is not claimed.
      tags: [Invoices]
      x-roles: [ACCOUNTING_MEMBER, ACCOUNTING_MANAGER]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204": { description: Claim released }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/invoices/{invoiceId}/resolution:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    post:
      operationId: resolveInvoiceExceptions
      summary: Mark the open exceptions as resolved without re-matching
      description: |
        For an invoice in status `EXCEPTION` claimed by the caller, e.g. a reviewed non-PO invoice (EX2, DEC-006).
        Sets the next status: `PENDING_APPROVAL` when the total amount is above the approval threshold
        (DEC-009, DEC-013), otherwise `PENDING_REVIEW`. The claim is cleared.
        `422` if an open exception is of a type that may not be accepted as is (SAPS-20 BR-06, Q1).
      tags: [Invoices]
      x-roles: [ACCOUNTING_MEMBER]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Exceptions resolved; next status set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/invoices/{invoiceId}/approval:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    post:
      operationId: decideInvoiceApproval
      summary: Approve or reject an invoice above the approval threshold
      description: |
        Allowed in status `PENDING_APPROVAL` (DEC-009). `APPROVED` → `PENDING_REVIEW`; `REJECTED` → `REJECTED`,
        a final state (DEC-014). A comment is required when rejecting.
      tags: [Invoices]
      x-roles: [ACCOUNTING_MANAGER]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalCreate" }
      responses:
        "200":
          description: Decision saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/invoices/{invoiceId}/confirmation:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    post:
      operationId: confirmInvoice
      summary: Confirm the final result
      description: Allowed in status `PENDING_REVIEW`; sets `COMPLETED`.
      tags: [Invoices]
      x-roles: [ACCOUNTING_MEMBER]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/invoices/{invoiceId}/rejection:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    post:
      operationId: rejectInvoice
      summary: Reject an invoice during exception handling or at final review
      description: |
        Allowed in status `EXCEPTION` (claimed by the caller) or `PENDING_REVIEW`; sets `REJECTED`, a final state
        (DEC-014). The Accounting Manager rejects through `decideInvoiceApproval`.
      tags: [Invoices]
      x-roles: [ACCOUNTING_MEMBER]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectionCreate" }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/invoices/{invoiceId}/file:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    get:
      operationId: downloadInvoiceFile
      summary: Download the uploaded invoice file
      description: Streams the file from SAPS File Storage through the SAPS API.
      tags: [Invoices]
      x-roles: [ACCOUNTING_MEMBER, ACCOUNTING_MANAGER]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The file
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/invoices/{invoiceId}/events:
    parameters:
      - $ref: "#/components/parameters/InvoiceId"
    get:
      operationId: listInvoiceEvents
      summary: List the audit trail of an invoice
      description: Oldest first.
      tags: [Invoices]
      x-roles: [ACCOUNTING_MEMBER, ACCOUNTING_MANAGER]
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of invoice events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceEventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/notifications:
    get:
      operationId: listNotifications
      summary: List the caller's notifications
      description: Newest first. Polled by the SAPS Web App (arc42 §6.2).
      tags: [Notifications]
      x-roles: [ACCOUNTING_MEMBER, ACCOUNTING_MANAGER]
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: markNotificationRead
      summary: Mark a notification as read
      tags: [Notifications]
      x-roles: [ACCOUNTING_MEMBER, ACCOUNTING_MANAGER]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204": { description: Marked as read (idempotent) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/matching-settings:
    get:
      operationId: getMatchingSettings
      summary: Get the matching settings of the caller's tenant
      tags: [MatchingSettings]
      x-roles: [ACCOUNTING_MANAGER]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The matching settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchingSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      operationId: updateMatchingSettings
      summary: Change the price tolerance and the approval threshold
      description: |
        Only the Accounting Manager (DEC-015). New values apply to matching runs and approval decisions that start
        after the change; invoices keep the values they were processed with (`priceToleranceApplied`, `approvalThresholdApplied`).
      tags: [MatchingSettings]
      x-roles: [ACCOUNTING_MANAGER]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchingSettingsUpdate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchingSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: saps_session
      description: Server-side session cookie set by `createSession` (HttpOnly, SameSite=Lax; ADR-0008). Simple user accounts, no SSO in the PoC (NFR-SEC-001).

  parameters:
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PageToken:
      name: pageToken
      in: query
      required: false
      description: Opaque cursor from the previous page's nextPageToken
      schema: { type: string }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Propagated to logs and to the SAPS Worker; generated if absent
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key; repeated requests with the same key return the original result
      schema: { type: string, maxLength: 64 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from `getInvoice`; prevents overwriting a newer version (optimistic locking)
      schema: { type: string }

  schemas:
    # ---------- enums (values = data model enums) ----------
    InvoiceStatus:
      type: string
      enum: [UPLOADED, MATCHING, EXCEPTION, PENDING_APPROVAL, PENDING_REVIEW, COMPLETED, REJECTED]
      description: Invoice lifecycle state (data model §5)
    InvoiceType:
      type: string
      enum: [TRADE_PO, NON_TRADE_PO, NON_PO]
      description: Derived from the PO number (DEC-005)
    ExceptionCode:
      type: string
      enum: [EX1, EX2, EX3, EX4, EX5, EX6, EX7, EX8, EX9, EX10]
      description: Exception types of the PoC (DEC-033; EX10 added in API 0.2.0)
    ExceptionStatus:
      type: string
      enum: [OPEN, RESOLVED]
    MatchStatus:
      type: string
      enum: [NOT_MATCHED, MATCHED, MISMATCH, NOT_APPLICABLE]
    Role:
      type: string
      enum: [ACCOUNTING_MEMBER, ACCOUNTING_MANAGER]
    ApprovalDecision:
      type: string
      enum: [APPROVED, REJECTED]
    NotificationType:
      type: string
      enum: [EXCEPTION_RAISED, APPROVAL_REQUESTED, REVIEW_REQUESTED]
      description: Recipients by type (DEC-021)

    # ---------- value types ----------
    Amount:
      type: string
      pattern: '^-?\d{1,16}(\.\d{1,2})?$'
      description: Decimal amount with up to 2 decimals
      examples: ["300.00"]
    UnitPrice:
      type: string
      pattern: '^-?\d{1,14}(\.\d{1,4})?$'
      description: Decimal unit price with up to 4 decimals
      examples: ["12.5000"]
    Quantity:
      type: string
      pattern: '^\d{1,15}(\.\d{1,3})?$'
      description: Decimal quantity with up to 3 decimals
      examples: ["10.000"]
    Currency:
      type: string
      enum: [USD]
      description: ISO 4217; USD only in the PoC (DEC-006)
    PoNumber:
      type: string
      pattern: '^[0-9]{7}$'
      description: 7 digits; prefix 0 = trade PO, 1 = non-trade PO (DEC-005). Other values raise EX3.

    # ---------- users ----------
    UserAccount:
      type: object
      required: [id, username, displayName, role]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        username: { type: string, maxLength: 100 }
        displayName: { type: string, maxLength: 200 }
        role: { $ref: "#/components/schemas/Role" }
    UserAccountRef:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, maxLength: 200 }
    SessionCreate:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 100 }
        password: { type: string, format: password, writeOnly: true, maxLength: 200 }

    # ---------- invoices ----------
    InvoiceFile:
      type: object
      required: [name, contentType, sizeBytes, sha256]
      properties:
        name: { type: string, maxLength: 255 }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    InvoiceSummary:
      type: object
      required: [id, status, currency, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        invoiceType: { oneOf: [{ $ref: "#/components/schemas/InvoiceType" }, { type: "null" }] }
        vendorName: { type: [string, "null"], maxLength: 200 }
        invoiceNumber: { type: [string, "null"], maxLength: 50 }
        totalAmount: { oneOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }] }
        currency: { $ref: "#/components/schemas/Currency" }
        openExceptionCodes:
          type: array
          items: { $ref: "#/components/schemas/ExceptionCode" }
        assignedTo: { oneOf: [{ $ref: "#/components/schemas/UserAccountRef" }, { type: "null" }] }
        updatedAt: { type: string, format: date-time }
    Invoice:
      type: object
      description: Invoice with lines, exceptions and approval (data model Invoice)
      required: [id, status, currency, file, uploadedBy, lines, exceptions, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        status: { $ref: "#/components/schemas/InvoiceStatus" }
        invoiceType: { oneOf: [{ $ref: "#/components/schemas/InvoiceType" }, { type: "null" }] }
        vendorCode: { type: [string, "null"], maxLength: 20 }
        vendorName: { type: [string, "null"], maxLength: 200 }
        invoiceNumber: { type: [string, "null"], maxLength: 50 }
        invoiceDate: { type: [string, "null"], format: date }
        currency: { $ref: "#/components/schemas/Currency" }
        subtotalAmount: { oneOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }] }
        taxAmount: { oneOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }] }
        totalAmount:
          description: Amount including tax; compared with the approval threshold (DEC-009)
          oneOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }]
        requiresApproval: { type: [boolean, "null"] }
        priceToleranceApplied: { oneOf: [{ $ref: "#/components/schemas/UnitPrice" }, { type: "null" }] }
        approvalThresholdApplied: { oneOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }] }
        assignedTo: { oneOf: [{ $ref: "#/components/schemas/UserAccountRef" }, { type: "null" }] }
        uploadedBy: { $ref: "#/components/schemas/UserAccountRef" }
        file: { $ref: "#/components/schemas/InvoiceFile" }
        rejectedReason: { type: [string, "null"], maxLength: 1000 }
        lines:
          type: array
          items: { $ref: "#/components/schemas/InvoiceLine" }
        exceptions:
          type: array
          items: { $ref: "#/components/schemas/InvoiceException" }
        approval: { oneOf: [{ $ref: "#/components/schemas/Approval" }, { type: "null" }] }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    InvoiceLine:
      type: object
      required: [id, lineNumber, matchStatus]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        lineNumber: { type: integer, minimum: 1 }
        description: { type: [string, "null"], maxLength: 500 }
        poNumber: { type: [string, "null"], maxLength: 20, description: "PO number as on the invoice; validated by matching (EX3), not by the API" }
        poLineNumber: { type: [integer, "null"], minimum: 1 }
        quantity: { oneOf: [{ $ref: "#/components/schemas/Quantity" }, { type: "null" }] }
        unitPrice: { oneOf: [{ $ref: "#/components/schemas/UnitPrice" }, { type: "null" }] }
        lineAmount: { oneOf: [{ $ref: "#/components/schemas/Amount" }, { type: "null" }] }
        matchStatus: { $ref: "#/components/schemas/MatchStatus" }
        poUnitPrice:
          description: PO unit price seen in the last matching run
          oneOf: [{ $ref: "#/components/schemas/UnitPrice" }, { type: "null" }]
        expectedQuantity:
          description: Received-not-invoiced (3-way) or PO quantity not yet invoiced (2-way) in the last run (DEC-007, DEC-023)
          oneOf: [{ $ref: "#/components/schemas/Quantity" }, { type: "null" }]
    InvoiceException:
      type: object
      required: [id, code, message, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        code: { $ref: "#/components/schemas/ExceptionCode" }
        message: { type: string, maxLength: 1000 }
        status: { $ref: "#/components/schemas/ExceptionStatus" }
        invoiceLineId: { type: [string, "null"], format: uuid }
        resolvedBy: { oneOf: [{ $ref: "#/components/schemas/UserAccountRef" }, { type: "null" }] }
        resolvedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    Approval:
      type: object
      required: [id, decision, decidedBy, decidedAt]
      properties:
        id: { type: string, format: uuid }
        decision: { $ref: "#/components/schemas/ApprovalDecision" }
        comment: { type: [string, "null"], maxLength: 1000 }
        decidedBy: { $ref: "#/components/schemas/UserAccountRef" }
        decidedAt: { type: string, format: date-time }
    InvoiceUpdate:
      type: object
      description: Corrections during exception handling. Fields not sent stay unchanged; `lines` replaces all lines.
      minProperties: 1
      properties:
        vendorCode: { type: string, maxLength: 20 }
        vendorName: { type: string, maxLength: 200 }
        invoiceNumber: { type: string, maxLength: 50 }
        invoiceDate: { type: string, format: date }
        subtotalAmount: { $ref: "#/components/schemas/Amount" }
        taxAmount: { $ref: "#/components/schemas/Amount" }
        totalAmount: { $ref: "#/components/schemas/Amount" }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/InvoiceLineUpdate" }
    InvoiceLineUpdate:
      type: object
      required: [lineNumber]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        description: { type: [string, "null"], maxLength: 500 }
        poNumber: { oneOf: [{ $ref: "#/components/schemas/PoNumber" }, { type: "null" }] }
        poLineNumber: { type: [integer, "null"], minimum: 1 }
        quantity: { $ref: "#/components/schemas/Quantity" }
        unitPrice: { $ref: "#/components/schemas/UnitPrice" }
        lineAmount: { $ref: "#/components/schemas/Amount" }
    ApprovalCreate:
      type: object
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/ApprovalDecision" }
        comment:
          type: string
          maxLength: 1000
          description: Required when the decision is REJECTED (otherwise 422)
    RejectionCreate:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    InvoiceEvent:
      type: object
      required: [id, statusTo, action, actor, occurredAt]
      properties:
        id: { type: string, format: uuid }
        statusFrom: { oneOf: [{ $ref: "#/components/schemas/InvoiceStatus" }, { type: "null" }] }
        statusTo: { $ref: "#/components/schemas/InvoiceStatus" }
        action: { type: string, maxLength: 50, examples: [UPLOAD, MATCH, UPDATE_FIELDS, APPROVE, REJECT, CONFIRM] }
        actor: { type: string, maxLength: 100, description: "Display name of the user, or `system`" }
        details: { type: [object, "null"], description: Changed fields with old and new values }
        occurredAt: { type: string, format: date-time }

    # ---------- notifications and settings ----------
    Notification:
      type: object
      required: [id, type, invoiceId, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/NotificationType" }
        invoiceId: { type: string, format: uuid }
        message: { type: string, maxLength: 500 }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    MatchingSettings:
      type: object
      required: [priceToleranceUsd, approvalThresholdUsd, updatedAt, updatedBy]
      properties:
        priceToleranceUsd: { $ref: "#/components/schemas/UnitPrice" }
        approvalThresholdUsd: { $ref: "#/components/schemas/Amount" }
        updatedAt: { type: string, format: date-time, readOnly: true }
        updatedBy: { type: string, readOnly: true }
    MatchingSettingsUpdate:
      type: object
      required: [priceToleranceUsd, approvalThresholdUsd]
      properties:
        priceToleranceUsd: { $ref: "#/components/schemas/UnitPrice" }
        approvalThresholdUsd: { $ref: "#/components/schemas/Amount" }

    # ---------- pages ----------
    InvoiceSummaryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InvoiceSummary" } }
        nextPageToken: { type: [string, "null"], description: Null when there are no more pages }
    InvoiceEventPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InvoiceEvent" } }
        nextPageToken: { type: [string, "null"] }
    NotificationPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        nextPageToken: { type: [string, "null"] }

    # ---------- errors ----------
    Problem:
      description: RFC 9457 Problem Details
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, description: "URI identifying the error type" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string, format: uuid }
        errors:
          type: array
          description: Field-level validation errors
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Unauthorized:
      description: Not signed in, or wrong credentials
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Forbidden:
      description: Signed in, but the role is not allowed (see x-roles), or the Origin header does not match (CSRF protection, ADR-0008)
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    NotFound:
      description: Does not exist in the caller's tenant
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    Conflict:
      description: Not allowed in the current status, or claimed by another Accounting Member
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    PayloadTooLarge:
      description: File larger than the maximum size
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    UnsupportedMediaType:
      description: File type is not PDF, JPEG or PNG
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    PreconditionFailed:
      description: The invoice changed since it was read (ETag does not match)
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    PreconditionRequired:
      description: The If-Match header is missing
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    UnprocessableEntity:
      description: Business validation failed
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
